name: Kust
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  dartchess: ^0.13.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  dio: ^5.11.1
  xml: ^7.0.1

dependency_overrides:
  stockfish:
    path: packages/stockfish

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/android-icon-background.png"

  adaptive_icon_background: "#FFBB00"
  adaptive_icon_foreground: "assets/icons/android-icon-foreground.png"

flutter_native_splash:
  color: "#FFBB00"
  color_dark: "#FFBB00"
  image: "assets/icons/splash.png"
  image_dark: "assets/icons/splash.png"

  android_12:
    color: "#FFBB00"
    color_dark: "#FFBB00"
    image: "assets/icons/splash.png"
    image_dark: "assets/icons/splash.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/bots/
    - assets/images/
