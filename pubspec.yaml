name: kust
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  dartchess: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/android-icon-background.png"

  adaptive_icon_background: "#CD9600"
  adaptive_icon_foreground: "assets/icons/android-icon-foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#CD9600"
  image: "assets/icons/splash.png"
  image_dark: "assets/icons/splash.png"

  android_12:
    color: "#FFFFFF"
    color_dark: "#CD9600"
    image: "assets/icons/splash.png"
    image_dark: "assets/icons/splash.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
