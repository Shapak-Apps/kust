name: kust
description: "Küşt: a minimalist chess app with bots, puzzles and pass-and-play."
publish_to: "none"
version: 1.8.1+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  dartchess: ^0.13.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  stockfish: any
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1

dependency_overrides:
  stockfish:
    path: packages/stockfish

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/android-icon-background.png"

  adaptive_icon_background: "#FFBB00"
  adaptive_icon_foreground: "assets/icons/android-icon-foreground.png"

flutter_native_splash:
  color: "#FFBB00"
  color_dark: "#FFBB00"
  image: "assets/icons/splash.png"
  image_dark: "assets/icons/splash.png"

  android_12:
    color: "#FFBB00"
    color_dark: "#FFBB00"
    image: "assets/icons/splash.png"
    image_dark: "assets/icons/splash.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/moves/
    - assets/bots/
    - assets/images/
    - assets/pieces/
    - assets/pieces/neo/
    - assets/pieces/walnut/
    - assets/pieces/carpet/
    - assets/sounds/
    - assets/puzzles/
    - assets/engine/
