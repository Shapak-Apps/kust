name: kust
description: "Küşt: a minimalist chess app with bots, puzzles and pass-and-play."
publish_to: "none"
version: 4.0.0+7

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.3.0
  dartchess: ^0.13.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  stockfish: any
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  share_plus: ^13.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  image_picker: ^1.2.4
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.2
  flutter_secure_storage: ^11.2.0

dependency_overrides:
  stockfish:
    path: packages/stockfish

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/android-icon-background.png"
  web:
    generate: true
    background_color: "#FFBB00"
    theme_color: "#FFBB00"
  macos:
    generate: true
    image_path: "docs/logo/kit/macos-icon.png"

  adaptive_icon_background: "#FFBB00"
  adaptive_icon_foreground: "assets/icons/android-icon-foreground.png"

flutter_native_splash:
  color: "#FFBB00"
  color_dark: "#FFBB00"
  # iOS and Android before 12 show this at 512 pt; its K is 104 pt, as big
  # as Android 12 draws splash.png's K, where the animation starts.
  image: "assets/icons/splash-small.png"
  image_dark: "assets/icons/splash-small.png"

  android_12:
    color: "#FFBB00"
    color_dark: "#FFBB00"
    image: "assets/icons/splash.png"
    image_dark: "assets/icons/splash.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/moves/
    - assets/bots/
    - assets/images/
    - assets/flags/
    - assets/pieces/
    - assets/pieces/graphite/
    - assets/pieces/shaded/
    - assets/pieces/brushed/
    - assets/pieces/learn/
    - assets/sounds/
    - assets/puzzles/
    - assets/openings/
    - assets/engine/
